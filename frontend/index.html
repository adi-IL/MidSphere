<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MidSphere</title>
    <meta
      name="description"
      content="MidSphere: autonomous context circuit-breaker for DataHub"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin:0;background:#000;color:#ededed;font-family:Geist,Inter,system-ui,sans-serif">
    <div id="root">
      <!-- Instant shell before React hydrates (avoids blank flash) -->
      <div
        id="boot-shell"
        style="
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          height:100vh;gap:12px;letter-spacing:-0.02em;
        "
      >
        <div
          style="
            width:48px;height:48px;border:1px solid #262626;border-radius:6px;
            background:#111;display:flex;align-items:center;justify-content:center;
            font-size:14px;font-weight:500;
          "
        >
          M
        </div>
        <div style="font-size:15px;font-weight:500">MidSphere</div>
        <div style="font-size:11px;color:#888">Context circuit-breaker for DataHub</div>
        <div
          style="
            margin-top:12px;width:160px;height:1px;background:#1a1a1a;overflow:hidden;
            border-radius:999px;
          "
        >
          <div
            style="
              width:50%;height:100%;background:#ededed;opacity:0.75;
              animation:bootbar 1.4s ease-in-out infinite;
            "
          ></div>
        </div>
        <div style="font-family:ui-monospace,monospace;font-size:10px;color:#666;letter-spacing:0.12em;text-transform:uppercase">
          Loading…
        </div>
      </div>
      <style>
        @keyframes bootbar {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(200%); }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot-shell div[style*="bootbar"] { animation: none !important; width: 40%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
