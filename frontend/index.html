<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MidSphere</title>
    <meta
      name="description"
      content="MidSphere: autonomous context circuit-breaker for DataHub"
    />
    <meta name="theme-color" content="#000000" />
    <!-- Favicon: circuit-sphere mark (icon only) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Social / link preview: full MidSphere logo -->
    <meta property="og:title" content="MidSphere" />
    <meta
      property="og:description"
      content="Autonomous context circuit-breaker engine for data platforms"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin:0;background:#000;color:#ededed;font-family:Geist,Inter,system-ui,sans-serif">
    <div id="root">
      <!-- Instant shell before React hydrates (avoids blank flash) -->
      <div
        id="boot-shell"
        style="
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          height:100vh;gap:0;letter-spacing:-0.02em;
        "
      >
        <img
          src="/logo-sm.png"
          alt="MidSphere"
          width="220"
          height="220"
          style="width:min(220px,56vw);height:auto;display:block"
        />
        <div
          style="
            margin-top:20px;width:160px;height:1px;background:#1a1a1a;overflow:hidden;
            border-radius:999px;
          "
        >
          <div
            style="
              width:50%;height:100%;background:#ededed;opacity:0.75;
              animation:bootbar 1.4s ease-in-out infinite;
            "
          ></div>
        </div>
        <div style="margin-top:14px;font-family:ui-monospace,monospace;font-size:10px;color:#666;letter-spacing:0.12em;text-transform:uppercase">
          Loading...
        </div>
      </div>
      <style>
        @keyframes bootbar {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(200%); }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot-shell div[style*="bootbar"] { animation: none !important; width: 40%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
